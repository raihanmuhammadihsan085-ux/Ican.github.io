<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilihan ketua OKTAN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-bottom: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .poll-info {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        
        .question {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .options {
            margin-bottom: 30px;
        }
        
        .option {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        
        .option:hover {
            background-color: #e9ecef;
            border-color: #3498db;
        }
        
        .option.selected {
            background-color: #d6eaf8;
            border-color: #3498db;
        }
        
        .option input {
            margin-right: 15px;
            transform: scale(1.3);
        }
        
        .option label {
            cursor: pointer;
            font-size: 1.1rem;
            flex-grow: 1;
        }
        
        .percentage-bar {
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }
        
        .percentage-fill {
            height: 100%;
            background-color: #3498db;
            border-radius: 4px;
            width: 0%;
            transition: width 1s ease;
        }
        
        .percentage-text {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
            text-align: right;
            display: none;
        }
        
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 15px;
        }
        
        button {
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }
        
        #submitBtn {
            background-color: #2ecc71;
            color: white;
        }
        
        #submitBtn:hover {
            background-color: #27ae60;
        }
        
        #resetBtn {
            background-color: #e74c3c;
            color: white;
        }
        
        #resetBtn:hover {
            background-color: #c0392b;
        }
        
        #resultsBtn {
            background-color: #3498db;
            color: white;
        }
        
        #resultsBtn:hover {
            background-color: #2980b9;
        }
        
        .results {
            margin-top: 30px;
            display: none;
        }
        
        .result-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .result-option {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .total-votes {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
            font-weight: 600;
            color: #2c3e50;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #2ecc71;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
            max-width: 300px;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            
            .container {
                padding: 20px;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="notification" id="notification">Polling berhasil dikirim!</div>
    
    <div class="container">
        <header>
            <h1>PEMILIHAN KETUA OKTAN</h1>
            <div class="poll-info">Pilih salah satu dari 3 opsi di bawah ini</div>
        </header>
        
        <div class="question" id="pollQuestion">PILIH KANDIDAT YANG ANDA INGINKAN </div>
        
        <div class="options" id="pollOptions">
            <!-- Opsi polling akan diisi oleh JavaScript -->
        </div>
        
        <div class="buttons">
            <button id="submitBtn">Kirim Polling</button>
            <button id="resetBtn">Reset Pilihan</button>
            <button id="resultsBtn">Lihat Hasil</button>
        </div>
        
        <div class="results" id="resultsContainer">
            <h2 style="margin-bottom: 20px; color: #2c3e50;">Hasil Polling</h2>
            <!-- Hasil polling akan ditampilkan di sini -->
        </div>
    </div>
    
    <footer>
        Dibuat oleh Ican 
    </footer>

    <script>
        // Data polling - HANYA 3 OPSI
        const pollData = {
            question: "PILIHLAH KETUA YANG DIBUTUHKAN BUKAN YANG DIGUNAKAN",
            options: [
                { id: 1, text: "ICAN", votes: 0 },
                { id: 2, text: "KITALIA", votes: 0 },
                { id: 3, text: "ABAS", votes: 0 }
            ],
            totalVotes: 0
        };

        // Elemen DOM
        const pollQuestion = document.getElementById('pollQuestion');
        const pollOptions = document.getElementById('pollOptions');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultsBtn = document.getElementById('resultsBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const notification = document.getElementById('notification');

        // State aplikasi
        let selectedOption = null;
        let hasVoted = localStorage.getItem('hasVoted') === 'true';
        let storedPollData = localStorage.getItem('pollData');

        // Jika ada data di localStorage, gunakan data tersebut
        if (storedPollData) {
            const parsedData = JSON.parse(storedPollData);
            pollData.options = parsedData.options;
            pollData.totalVotes = parsedData.totalVotes;
        }

        // Fungsi untuk menampilkan opsi polling
        function renderPollOptions() {
            pollOptions.innerHTML = '';
            pollQuestion.textContent = pollData.question;
            
            pollData.options.forEach(option => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.dataset.id = option.id;
                
                // Hitung persentase jika sudah ada voting
                let percentage = 0;
                if (pollData.totalVotes > 0) {
                    percentage = Math.round((option.votes / pollData.totalVotes) * 100);
                }
                
                optionElement.innerHTML = `
                    <input type="radio" name="pollOption" id="option${option.id}" ${hasVoted ? 'disabled' : ''}>
                    <label for="option${option.id}">${option.text}</label>
                    <div class="percentage-bar" id="bar${option.id}">
                        <div class="percentage-fill" id="fill${option.id}" style="width: ${percentage}%"></div>
                    </div>
                    <div class="percentage-text" id="text${option.id}">${option.votes} suara (${percentage}%)</div>
                `;
                
                // Tambahkan event listener untuk pemilihan
                if (!hasVoted) {
                    optionElement.addEventListener('click', () => selectOption(option.id));
                }
                
                // Tampilkan persentase jika sudah vote
                if (hasVoted) {
                    optionElement.querySelector('.percentage-bar').style.display = 'block';
                    optionElement.querySelector('.percentage-text').style.display = 'block';
                }
                
                pollOptions.appendChild(optionElement);
            });
            
            // Nonaktifkan tombol submit jika sudah vote
            if (hasVoted) {
                submitBtn.disabled = true;
                submitBtn.style.backgroundColor = '#95a5a6';
                submitBtn.textContent = 'Sudah Memilih';
            }
        }

        // Fungsi untuk memilih opsi
        function selectOption(optionId) {
            // Reset pilihan sebelumnya
            if (selectedOption) {
                const prevOption = document.querySelector(`.option[data-id="${selectedOption}"]`);
                if (prevOption) prevOption.classList.remove('selected');
            }
            
            // Set pilihan baru
            selectedOption = optionId;
            const currentOption = document.querySelector(`.option[data-id="${optionId}"]`);
            if (currentOption) {
                currentOption.classList.add('selected');
                const radioInput = currentOption.querySelector('input[type="radio"]');
                if (radioInput) radioInput.checked = true;
            }
        }

        // Fungsi untuk mengirim polling
        function submitVote() {
            if (!selectedOption) {
                showNotification("Silakan pilih opsi terlebih dahulu!", "#e74c3c");
                return;
            }
            
            // Update data polling
            const selectedOptionData = pollData.options.find(option => option.id == selectedOption);
            if (selectedOptionData) {
                selectedOptionData.votes++;
                pollData.totalVotes++;
                
                // Simpan ke localStorage
                localStorage.setItem('pollData', JSON.stringify({
                    options: pollData.options,
                    totalVotes: pollData.totalVotes
                }));
                
                // Tandai bahwa user sudah vote
                localStorage.setItem('hasVoted', 'true');
                hasVoted = true;
                
                // Update tampilan
                renderPollOptions();
                showResults();
                
                // Tampilkan notifikasi
                showNotification("Terima kasih! Polling Anda telah direkam.", "#2ecc71");
                
                // Nonaktifkan tombol submit
                submitBtn.disabled = true;
                submitBtn.style.backgroundColor = '#95a5a6';
                submitBtn.textContent = 'Sudah Memilih';
            }
        }

        // Fungsi untuk mereset pilihan
        function resetSelection() {
            if (hasVoted) {
                showNotification("Anda sudah memilih, tidak bisa mereset pilihan.", "#e74c3c");
                return;
            }
            
            if (selectedOption) {
                const selectedOptionEl = document.querySelector(`.option[data-id="${selectedOption}"]`);
                if (selectedOptionEl) {
                    selectedOptionEl.classList.remove('selected');
                    const radioInput = selectedOptionEl.querySelector('input[type="radio"]');
                    if (radioInput) radioInput.checked = false;
                }
                selectedOption = null;
            }
        }

        // Fungsi untuk menampilkan hasil
        function showResults() {
            resultsContainer.innerHTML = '';
            resultsContainer.style.display = 'block';
            
            // Buat judul
            const title = document.createElement('h2');
            title.textContent = 'Hasil Polling (3 Opsi)';
            title.style.marginBottom = '20px';
            title.style.color = '#2c3e50';
            resultsContainer.appendChild(title);
            
            // Urutkan berdasarkan jumlah suara terbanyak
            const sortedOptions = [...pollData.options].sort((a, b) => b.votes - a.votes);
            
            // Tampilkan hasil per opsi
            sortedOptions.forEach(option => {
                const percentage = pollData.totalVotes > 0 ? 
                    Math.round((option.votes / pollData.totalVotes) * 100) : 0;
                
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                
                resultItem.innerHTML = `
                    <div class="result-option">
                        <span>${option.text}</span>
                        <span>${option.votes} suara</span>
                    </div>
                    <div class="percentage-bar">
                        <div class="percentage-fill" style="width: ${percentage}%; background-color: ${percentage > 50 ? '#2ecc71' : '#3498db'}"></div>
                    </div>
                    <div style="text-align: right; color: #7f8c8d; font-size: 0.9rem; margin-top: 5px;">
                        ${percentage}%
                    </div>
                `;
                
                resultsContainer.appendChild(resultItem);
            });
            
            // Tampilkan total suara
            const totalVotesEl = document.createElement('div');
            totalVotesEl.className = 'total-votes';
            totalVotesEl.textContent = `Total Suara: ${pollData.totalVotes}`;
            resultsContainer.appendChild(totalVotesEl);
            
            // Scroll ke hasil
            resultsContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // Fungsi untuk menampilkan notifikasi
        function showNotification(message, color = "#2ecc71") {
            notification.textContent = message;
            notification.style.backgroundColor = color;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // Fungsi untuk reset seluruh polling (untuk keperluan testing)
        function resetPoll() {
            if (confirm("Apakah Anda yakin ingin mereset seluruh polling? Ini akan menghapus semua data voting.")) {
                localStorage.removeItem('pollData');
                localStorage.removeItem('hasVoted');
                
                // Reset data polling
                pollData.options.forEach(option => option.votes = 0);
                pollData.totalVotes = 0;
                hasVoted = false;
                selectedOption = null;
                
                // Reset tampilan
                renderPollOptions();
                resultsContainer.style.display = 'none';
                
                // Aktifkan tombol submit
                submitBtn.disabled = false;
                submitBtn.style.backgroundColor = '#2ecc71';
                submitBtn.textContent = 'Kirim Polling';
                
                showNotification("Polling telah direset!", "#3498db");
            }
        }

        // Event listeners
        submitBtn.addEventListener('click', submitVote);
        resetBtn.addEventListener('click', resetSelection);
        resultsBtn.addEventListener('click', showResults);
        
        // Tambahkan event listener untuk reset polling (dengan klik ganda pada tombol reset)
        let resetClickCount = 0;
        resetBtn.addEventListener('dblclick', resetPoll);

        // Inisialisasi aplikasi
        renderPollOptions();
        
        // Jika sudah pernah vote, tampilkan hasil
        if (hasVoted) {
            setTimeout(() => {
                showResults();
            }, 500);
        }
    </script>
</body>
</html>
